services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  vote:
    build: ./vote
    environment:
      REDIS_HOST: redis
      VOTING_OPTIONS: "Python,Java,JavaScript,C++,Go,Rust,C#,C"
    ports:
      - "5000:5000"
    depends_on:
      - redis

  worker:
    build: ./worker
    depends_on:
      - redis
      - postgres

  result:
    build: ./result
    environment:
      DB_HOST: postgres
      VOTING_OPTIONS: "Python,Java,JavaScript,C++,Go,Rust,C#,C"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
    ports:
      - "4000:4000"
    depends_on:
      - postgres